# hvac-survey —— Cloudflare Worker（Worker 脚本 + 静态资源 + D1 + R2）
#
# 说明：Cloudflare 新版控制台把 Git 仓库统一建成 Worker，不再新建 Pages 项目，
#       也不再自动编译 functions/ 目录。因此后端已合并为单个入口脚本 worker/index.js，
#       原来 Pages 的「Build output directory」改由 [assets].directory 承担。

name = "hvac-survey"
compatibility_date = "2026-09-28"
main = "./worker/index.js"

# 静态资源目录（原 Pages 的构建输出目录）
# Worker 先接管全部请求：/api/* 走接口，其余再回落到静态资源
[assets]
directory = "public"
run_worker_first = true
binding = "ASSETS"

# D1 绑定：问卷数据
[[d1_databases]]
binding = "DB"
database_name = "survey-db"
database_id = "4ebe42e0-a3b0-4c33-a0f3-141a9ea61c71"

# R2 绑定：身份证照片
[[r2_buckets]]
binding = "IDCARDS"
bucket_name = "survey-idcards"

# 管理员口令（后台查看 / 导出答卷用）
[vars]
ADMIN_TOKEN = "hvac-survey-2026-7kd2"
# 发件地址：必须是本域名（199118.xyz 已在 Cloudflare 开通 Email Routing）
MAIL_FROM = "noreply@199118.xyz"

# 邮件发送绑定（Cloudflare Email Service）
# 不带 destination_address / allowed_destination_addresses = 可以发给账号里**任意已通过验证**的
# 目的地址；发给已验证地址不占额度、永久免费，收件人在后台页面里自己填。
[[send_email]]
name = "EMAIL"

# 定时任务：每小时整点触发一次，代码里判断是否到了后台配置的「发送时间」，到点且当天没发过才发。
# 这样发送时间可以在后台随时改，不用改配置重新部署。
[triggers]
crons = ["0 * * * *"]
